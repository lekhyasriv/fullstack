<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="wrapper">
        <h1>Student Profile</h1>

        <div class="input-box">
            <input type="text" id="studentName" placeholder="Name">
            <input type="text" id="studentRoll" placeholder="Roll Number">
            <input type="text" id="studentDept" placeholder="Department">
            <input type="number" id="studentCgpa" placeholder="CGPA" step="0.01">

            <button onclick="generateProfile()">Display Profile</button>
        </div>

        <div id="output"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
